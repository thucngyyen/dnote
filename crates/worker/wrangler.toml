name = "dnote"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"

[build]
command = "worker-build --release"

# The web app (web/dist) is served from Workers Assets; only /api/* runs the Rust worker.
[assets]
directory = "../../web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dnote"
# `npx wrangler d1 create dnote` prints the real id; replace this before `wrangler deploy`.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "NOTES"
bucket_name = "dnote-notes"

# Set the token with: npx wrangler secret put DNOTE_TOKEN   (local dev: .dev.vars)
