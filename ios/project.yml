name: DNote
options:
  bundleIdPrefix: dev.dnote
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  DNote:
    type: application
    platform: iOS
    sources:
      - DNote
      - Generated/dnote_ffi.swift
    dependencies:
      - framework: Frameworks/DNoteFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dnote.app
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DNote/Info.plist
      properties:
        CFBundleDisplayName: DNote
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Notes live in Documents/Notes and are visible in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Lets a phone reach a DNote server on your Mac/LAN (e.g. http://192.168.1.20:8787).
        NSLocalNetworkUsageDescription: DNote connects to your self-hosted notes server on the local network.
        NSPhotoLibraryUsageDescription: DNote adds photos you pick to your notes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
