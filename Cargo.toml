[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/worker", "crates/wasm", "crates/ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dnote-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
opt-level = "s"
